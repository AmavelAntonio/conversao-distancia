name: CI-CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
    - name: Getting project code from github
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Python dependecies
      working-directory: ./src
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Tests
      working-directory: ./src
      run: |
        python -m pytest tests/ -v

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./src
        file: ./src/Dockerfile
        push: true
        tags: |
          amavelantonio/encontros-tech:latest
          amavelantonio/encontros-tech:${github.run_number}

  CD:
    runs-on: ubuntu-latest
    needs: [ CI ]
    steps:
    - run: echo "Obter o codigo"
    - run: echo "Configurar o kubeconfig"
    - run: echo "Enviar a imagem docker"
